<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="solana-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0D223F" />
      <stop offset="100%" stopColor="#05101F" />
    </linearGradient>
    <radialGradient id="solana-glow" cx="50%" cy="36%" r="42%">
      <stop offset="0%" stopColor="#C88A36" stopOpacity="0.45" />
      <stop offset="100%" stopColor="#C88A36" stopOpacity="0" />
    </radialGradient>
    <linearGradient id="solana-gold" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#E5B263" />
      <stop offset="50%" stopColor="#C88A36" />
      <stop offset="100%" stopColor="#9E6820" />
    </linearGradient>
  </defs>

  <!-- Luxury Badge Base (Rounded Squircle for Browser Tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#solana-bg)" stroke="url(#solana-gold)" stroke-width="1.6" />
  <rect x="5.5" y="5.5" width="53" height="53" rx="11" fill="none" stroke="#C88A36" stroke-width="0.8" stroke-opacity="0.35" />

  <!-- Sun Glow -->
  <circle cx="32" cy="23" r="14" fill="url(#solana-glow)" />

  <!-- Keystone Stepped Diamond (Chakana Accent at Arch Apex) -->
  <path d="M32 7.5L35.5 11L32 14.5L28.5 11Z" fill="url(#solana-gold)" stroke="#9E6820" stroke-width="0.7" />

  <!-- Radiant Solar Core & Rays (Inti / Solana) -->
  <circle cx="32" cy="23" r="4.2" fill="url(#solana-gold)" />
  <circle cx="32" cy="23" r="2" fill="#0D223F" />
  
  <path d="
    M32 14.5V17
    M32 29V31.5
    M23.5 23H26
    M38 23H40.5
    M26 17L27.8 18.8
    M36.2 27.2L38 29
    M38 17L36.2 18.8
    M27.8 27.2L26 29
  " stroke="url(#solana-gold)" stroke-width="1.3" stroke-linecap="round" />

  <!-- Colonial Baroque Archway -->
  <path d="M17 50V31C17 22.7157 23.7157 16 32 16C40.2843 16 47 22.7157 47 31V50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" />
  <path d="M20.5 50V31.5C20.5 25.1487 25.6487 20 32 20C38.3513 20 43.5 25.1487 43.5 31.5V50" stroke="url(#solana-gold)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Arch Radial Joints -->
  <path d="M23 23L24.8 24.8 M32 16V19.5 M41 23L39.2 24.8" stroke="url(#solana-gold)" stroke-width="1" />

  <!-- Intertwined Monogram «CS» -->
  <!-- 'C' in Crisp White -->
  <path d="M34 35C30.5 35 27 37 27 41.5C27 46 30.5 48 34 48C35.5 48 36.8 47.3 37.5 46.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <!-- 'S' in Warm Solana Gold -->
  <path d="M36 37C34.5 35.8 32.5 35.5 31 36.5C29.2 37.8 29.8 39.8 32 40.8C34.6 42 35 44 33.8 45.4C32.4 46.8 30 46.5 28.5 45.2" stroke="url(#solana-gold)" stroke-width="1.8" stroke-linecap="round" />

  <!-- Base Plinth & Heritage Dots -->
  <line x1="13" y1="50" x2="51" y2="50" stroke="url(#solana-gold)" stroke-width="2.2" stroke-linecap="round" />
  <line x1="10" y1="53.5" x2="54" y2="53.5" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-opacity="0.9" />

  <circle cx="16" cy="56.5" r="1.1" fill="url(#solana-gold)" />
  <circle cx="32" cy="56.5" r="1.3" fill="url(#solana-gold)" />
  <circle cx="48" cy="56.5" r="1.1" fill="url(#solana-gold)" />
</svg>