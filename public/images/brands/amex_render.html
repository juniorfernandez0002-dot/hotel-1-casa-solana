<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    width: 84px;
    height: 54px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 84px;
    height: 54px;
    background: #006FCF;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px 6px;
  }
  img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
</style>
</head>
<body>
  <div class="card">
    <img src="amex.svg" alt="American Express" />
  </div>
</body>
</html>
